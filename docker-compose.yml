services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketeer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ticketeer}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ticketeer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ticketeer}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ticketeer_pgdata: